<title>Spelling Sprites</title>

<!-- ==========================================================================
     SPELLING SPRITES
     A research-backed spelling practice app in one self-contained HTML file.

     Four parts, each behind a banner comment:
       1. STYLE   - all CSS, custom properties in :root
       2. MARKUP  - static shells; most screens are rendered by JS
       3. MODULES - LEX (word analysis), ART (sprite drawing), SPEAK, SFX, OCR
       4. APP     - store, scheduler, session engine, views

     Method notes are in the README and in Grown-ups > How this works.
     ========================================================================== -->

<style>
/* ============================ 1. STYLE ================================== */
:root{
  --bg:#FFFBF5;
  --card:#FFFFFF;
  --ink:#241F38;          /* 13.9:1 on --bg */
  --muted:#5F5878;        /* 6.1:1 on --bg - do not lighten past 4.5:1 */
  --line:#E9E1F2;
  --violet:#6C3FE0;
  --violet-soft:#F1EAFF;
  --teal:#00937A;
  --teal-soft:#E0F5F0;
  --coral:#D93A5B;
  --coral-soft:#FFECEF;
  --gold:#B87400;
  --gold-soft:#FFF3D6;
  --shadow:0 2px 0 rgba(36,31,56,.06), 0 8px 24px rgba(36,31,56,.07);
  --r:18px;
  --tap:52px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%;
  overscroll-behavior-y:contain;
}
body.big{font-size:18px}
#app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}

/* --- top bar --- */
#topbar{
  position:sticky;top:0;z-index:30;background:var(--bg);
  padding:calc(env(safe-area-inset-top) + 12px) 16px 10px;
  display:flex;align-items:center;gap:10px;
}
#topbar h1{font-size:18px;margin:0;font-weight:800;letter-spacing:-.2px;flex:1}
.pill{
  display:inline-flex;align-items:center;gap:5px;background:var(--card);
  border:1px solid var(--line);border-radius:999px;padding:5px 11px;
  font-size:13px;font-weight:700;white-space:nowrap;
}
.pill b{font-weight:800}

/* --- layout --- */
main{flex:1;padding:0 16px 24px}
.view{display:none;animation:fade .18s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin:0 0 14px}
.card.flat{box-shadow:none}
h2{font-size:20px;margin:22px 0 12px;letter-spacing:-.3px}
h3{font-size:15px;margin:0 0 8px;letter-spacing:-.1px}
p{margin:0 0 10px}
.muted{color:var(--muted);font-size:14px}
.tiny{font-size:12.5px;color:var(--muted);line-height:1.45}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.spread{justify-content:space-between}
.grow{flex:1;min-width:0}
.center{text-align:center}
.hide{display:none !important}

/* --- buttons --- */
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:var(--tap);padding:0 20px;border-radius:14px;
  background:var(--violet);color:#fff;font-weight:800;font-size:16px;
  box-shadow:0 3px 0 #4A24AE;transition:transform .06s,box-shadow .06s;
}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #4A24AE}
.btn.wide{width:100%}
.btn.big{min-height:64px;font-size:19px;border-radius:18px}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost:active{transform:translateY(1px);background:#F7F3FD}
.btn.go{background:var(--teal);box-shadow:0 3px 0 #006B58}
.btn.go:active{box-shadow:0 1px 0 #006B58}
.btn.warn{background:var(--coral);box-shadow:0 3px 0 #A32441}
.btn.warn:active{box-shadow:0 1px 0 #A32441}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px;border-radius:11px;box-shadow:none}
.btn[disabled]{opacity:.45;pointer-events:none}
.iconbtn{width:44px;height:44px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;font-size:20px;border:1.5px solid var(--line);background:var(--card)}

/* --- inputs --- */
input[type=text],input[type=date],input[type=number],textarea,select{
  width:100%;font:inherit;color:var(--ink);background:var(--card);
  border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;min-height:var(--tap);
}
textarea{min-height:150px;resize:vertical;line-height:1.6}
input:focus,textarea:focus,select:focus{outline:2.5px solid var(--violet);outline-offset:1px;border-color:transparent}
label.fld{display:block;margin:0 0 12px}
label.fld > span{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:0 0 5px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.switch:last-child{border-bottom:0}
.switch input{width:auto;min-height:0;accent-color:var(--violet);transform:scale(1.4);margin-right:4px}

/* --- tab bar --- */
#tabs{
  position:sticky;bottom:0;z-index:30;display:flex;background:rgba(255,251,245,.94);
  backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding:6px 6px calc(env(safe-area-inset-bottom) + 6px);
}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px;color:var(--muted);font-size:11px;font-weight:700}
#tabs button .ic{font-size:21px;line-height:1}
#tabs button.on{color:var(--violet);background:var(--violet-soft)}
body.playing #tabs{display:none}

/* --- word display --- */
.word{
  font-weight:800;letter-spacing:.09em;text-align:center;line-height:1.25;
  word-break:break-word;font-variant-ligatures:none;
}
.word.xl{font-size:clamp(34px,10.5vw,52px)}
.word.lg{font-size:clamp(26px,7.5vw,36px)}
.word .ok{color:var(--ink)}
.word .bad{color:var(--coral);text-decoration:line-through;text-decoration-thickness:2.5px}
.word .miss{color:var(--coral);opacity:.8}
.word .fix{color:var(--gold);background:var(--gold-soft);border-radius:5px;padding:0 2px}
.word .blank{color:var(--violet);opacity:.35}

.chips{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}
.chip{
  background:var(--violet-soft);color:var(--violet);border-radius:10px;
  padding:7px 13px;font-weight:800;letter-spacing:.05em;font-size:17px;
}
.chip.sm{font-size:13px;padding:5px 10px;letter-spacing:0}
.tag{display:inline-block;background:var(--teal-soft);color:var(--teal);border-radius:8px;padding:3px 9px;font-size:12px;font-weight:800;margin:0 5px 5px 0}

/* --- answer box --- */
.answer{
  width:100%;text-align:center;font-size:clamp(26px,7.5vw,34px);font-weight:800;
  letter-spacing:.08em;padding:16px 12px;border:2.5px dashed var(--line);border-radius:16px;
  background:#FDFCFF;min-height:74px;
}
.answer:focus{border-style:solid;border-color:var(--violet);outline:none;background:#fff}

/* --- progress --- */
.bar{height:9px;background:var(--line);border-radius:99px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--violet);border-radius:99px;transition:width .3s}
.bar.teal > i{background:var(--teal)}
.dots{display:flex;gap:3px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.f{background:var(--teal)}

/* --- feedback banners --- */
.verdict{border-radius:16px;padding:14px;text-align:center;font-weight:800;margin:0 0 14px}
.verdict.yes{background:var(--teal-soft);color:var(--teal)}
.verdict.no{background:var(--gold-soft);color:var(--gold)}
.pop{animation:pop .34s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.86)}60%{transform:scale(1.05)}100%{transform:scale(1)}}

/* --- sprite gallery --- */
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.sprite{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:9px 6px 8px;text-align:center;box-shadow:var(--shadow)}
.sprite svg{width:100%;height:auto;display:block}
.sprite .nm{font-size:11.5px;font-weight:800;margin-top:3px}
.sprite.locked{opacity:.32;filter:grayscale(1)}
.sprite.locked .nm{color:var(--muted)}

/* --- word rows --- */
.wrow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.wrow:last-child{border-bottom:0}
.wrow .wt{font-weight:700;letter-spacing:.02em}
.badge{font-size:11px;font-weight:800;border-radius:7px;padding:3px 8px;white-space:nowrap}
.badge.new{background:var(--violet-soft);color:var(--violet)}
.badge.learn{background:var(--gold-soft);color:var(--gold)}
.badge.mast{background:var(--teal-soft);color:var(--teal)}
.badge.hard{background:var(--coral-soft);color:var(--coral)}

/* --- segmented control --- */
.seg{display:flex;background:var(--violet-soft);border-radius:13px;padding:4px;gap:4px;margin:0 0 14px}
.seg button{flex:1;min-height:42px;border-radius:10px;font-weight:800;font-size:14px;color:var(--violet)}
.seg button.on{background:var(--card);box-shadow:var(--shadow);color:var(--ink)}

/* --- misc --- */
.empty{text-align:center;padding:34px 16px;color:var(--muted)}
.empty .ic{font-size:44px;display:block;margin-bottom:10px}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv b{font-weight:800}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.stats .s{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 6px}
.stats .s b{display:block;font-size:23px;font-weight:800;line-height:1.15}
.stats .s span{font-size:11.5px;color:var(--muted);font-weight:700}
.note{background:var(--violet-soft);border-radius:13px;padding:12px 14px;font-size:13.5px;line-height:1.5}
.ref{font-size:12.5px;color:var(--muted);line-height:1.5;margin:0 0 9px}

/* --- print --- */
#print{display:none}
@media print{
  body{background:#fff}
  #app,#tabs{display:none !important}
  #print{display:block;padding:0;font-size:13pt;color:#000}
  #print h1{font-size:19pt;margin:0 0 2pt}
  #print .sub{font-size:10.5pt;color:#444;margin:0 0 18pt}
  #print ol{line-height:2.7;padding-left:26pt}
  #print li{border-bottom:1px solid #bbb;max-width:340pt}
  #print .dict{page-break-before:always}
  #print .dict li{border:0;line-height:1.7}
}
</style>

<!-- ============================ 2. MARKUP ================================= -->
<div id="app">
  <header id="topbar">
    <h1 id="title">Spelling Sprites</h1>

    <span class="pill" id="p-gems" title="Gems toward the next egg">💎 <b>0</b></span>
  </header>

  <main>
    <section id="v-home"    class="view on"></section>
    <section id="v-lists"   class="view"></section>
    <section id="v-play"    class="view"></section>
    <section id="v-sprites" class="view"></section>
    <section id="v-grown"   class="view"></section>
  </main>

  <nav id="tabs">
    <button data-go="home"><span class="ic">🎯</span>Play</button>
    <button data-go="lists"><span class="ic">📋</span>Words</button>
    <button data-go="sprites"><span class="ic">🥚</span>Sprites</button>
    <button data-go="grown"><span class="ic">🔒</span>Grown-ups</button>
  </nav>
</div>

<div id="print"></div>

  BANK_RAW.forEach(function(row){
    const p = row.split("|");
    BANK.set(p[0].toLowerCase(), {w:p[0], s:p[1], g:+p[2], f:p[3] || ""});
  });

  /* Homophones only teach anything in sets, so they are generated in sets. */
  const HOMOPHONES = [
    ["their","there","they're"], ["your","you're"], ["its","it's"], ["to","too","two"],
    ["hear","here"], ["write","right"], ["know","no"], ["one","won"], ["sea","see"],
    ["blue","blew"], ["weather","whether"], ["piece","peace"], ["through","threw"],
    ["wear","where"], ["hole","whole"], ["mail","male"], ["plain","plane"],
    ["road","rode"], ["son","sun"], ["tail","tale"], ["would","wood"]

  /* Words that show up on a printed spelling handout but are not the words. */
  const NOISE = new Set(("name date week spelling list words word unit lesson practice test "+
    "homework due grade class school teacher review study monday tuesday wednesday thursday "+
    "friday saturday sunday challenge bonus sight core extra new").split(" "));

  /* Words shaped like magic e where the e is doing something else. */
  const NOT_MAGIC_E = new Set(("above become before courage favorite furniture here imagine lose "+
    "machine measure medicine minute move notice opposite picture police practice prepare "+
    "pressure purpose schedule separate sure there village were where have give live come "+
    "some done none love glove dove gone one whose house mouse please cause chocolate "+
    "climate delicate definite private engine promise service office active native examine "+
    "determine genuine figure capture creature adventure temperature treasure pleasure "+
    "feature mixture culture lecture signature purchase surface").split(" "));

  const DIGRAPHS = new Set(["ch","sh","th","wh","ph","ck","ng","gh","qu"]);
  const SUFFIXES = ["tion","sion","ment","ness","able","ible","ing","est","ful","less","ly","ed","er","es"];

  function isV(c){ return VOWELS.indexOf(c) >= 0; }

  /* Sound chunks for writing a long word in pieces.
     English cannot be syllabified reliably without a pronunciation dictionary,
     so this is a decoding aid, not a syllabification lesson: split on affixes,
     then on VCCV, then on VCV, and keep a silent final e attached to the chunk
     it belongs to. Anything it is not confident about comes back whole. */
  function chunks(raw){
    const w = String(raw).toLowerCase().replace(/[^a-z']/g, "");
    if(w.indexOf("'") >= 0) return [raw];        /* contractions stay whole */
    if(w.length < 5) return [raw];

    let stem = w, tail = "";
    for(const suf of SUFFIXES){
      if(w.length - suf.length >= 3 && w.slice(-suf.length) === suf){
        stem = w.slice(0, -suf.length); tail = suf; break;
      }
    }

    const cuts = [];
    const last = function(){ return cuts.length ? cuts[cuts.length-1] : 0; };
    const okCut = function(c){ return c - last() >= 2 && stem.length - c >= 2; };
    let i = 1;
    while(i < stem.length - 1){
      if(isV(stem[i-1]) && !isV(stem[i])){
        if(!isV(stem[i+1]) && isV(stem[i+2])){           /* VCCV: hap|pen */
          const pair = stem[i] + stem[i+1];
          const c = DIGRAPHS.has(pair) ? i : i + 1;      /* keep ch/th/sh whole */
          if(okCut(c)){ cuts.push(c); i = c + 1; continue; }
        }else if(isV(stem[i+1])){                        /* VCV: to|mor */
          if(okCut(i)){ cuts.push(i); i = i + 1; continue; }
        }
      }
      i++;
    }

    let parts = [];
    let prev = 0;
    cuts.forEach(function(c){ parts.push(stem.slice(prev, c)); prev = c; });
    parts.push(stem.slice(prev));
    if(tail) parts.push(tail);
    parts = parts.filter(function(p){ return p.length; });

    /* rememb|er -> remem|ber : -er and -est are their own syllable, so they
       pull one consonant off a cluster in front of them. Digraphs stay whole,
       which keeps toge|th|er as to-geth-er rather than to-get-her. */
    if((tail === "er" || tail === "est") && parts.length >= 2){
      const k = parts.length - 2, pre = parts[k];
      if(/[bcdfghjklmnpqrstvwxz]{2}$/.test(pre) && pre.length > 2 && !DIGRAPHS.has(pre.slice(-2))){
        parts[k+1] = pre.slice(-1) + parts[k+1];
        parts[k] = pre.slice(0, -1);
      }
    }

    /* a chunk with no vowel is not a chunk, and a word-final silent e belongs
       to the chunk before it (be|cau|se -> be|cause) */
    const merged = [];
    parts.forEach(function(p, i){
      const vowelless = !/[aeiouy]/.test(p);
      const silentE = i === parts.length - 1 && /^[bcdfghjklmnpqrstvwxz]{1,2}e$/.test(p);
      if((vowelless || silentE) && merged.length) merged[merged.length-1] += p;
      else merged.push(p);
    });
    if(merged.length < 2 || merged.length > 5) return [raw];

    const out = []; let idx = 0;
    merged.forEach(function(m){ out.push(raw.substr(idx, m.length)); idx += m.length; });
    if(idx < raw.length) out[out.length-1] += raw.slice(idx);
    return out;
  }

    {id:"tion", label:"-tion / -sion",

    {id:"double", label:"Double letters",

     test:function(w){ return /'/.test(w); },
     tip:"Two words squeezed into one. The apostrophe stands exactly where the missing letters were."},
    {id:"three-syl", label:"Long word",
     test:function(w){ return chunks(w).length >= 3; },
     tip:"Break it into chunks and spell one chunk at a time. Long words are just short words in a row."}
  ];

  function patterns(raw){
    const w = String(raw).toLowerCase();

  function mainPattern(raw){
    const p = patterns(raw);
    return p.length ? p[0] : null;
  }
  function sentenceFor(raw){
    const e = BANK.get(String(raw).toLowerCase());

  /* Turn whatever came off a photo, a paste or a keyboard into clean words. */
  function parse(text){
    const seen = new Set(), out = [];
    String(text || "").split(/[\n\r,;\t•·|]+/).forEach(function(line){
      line.split(/\s{2,}/).forEach(function(part){
        let t = part.trim()
          .replace(/^[\s\-–—*.)\]\d]+/, "")   /* list numbering / bullets */
          .replace(/[.,;:!?"'’”)\]]+$/, "")
          .replace(/^["'‘“(\[]+/, "")
          .trim();
        if(!t) return;
        if(!/^[A-Za-z][A-Za-z'\-]*$/.test(t)) return;   /* no digits, no junk */
        if(t.length < 2 || t.length > 20) return;
        if(NOISE.has(t.toLowerCase())) return;
        const k = t.toLowerCase();
        if(seen.has(k)) return;
        seen.add(k); out.push(t);
      });
    });
    return out;
  }

  function shuf(a){ for(let i=a.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

  /* Which patterns have enough words in the bank to build a whole list from. */
  function focusOptions(){
    const counts = {};
    BANK.forEach(function(e){
      patterns(e.w).forEach(function(p){ counts[p.id] = (counts[p.id] || 0) + 1; });
    });
    const out = [{id:"", label:"A mix of everything"}];
    PATTERNS.forEach(function(p){
      if(counts[p.id] >= 10) out.push({id:p.id, label:p.label, n:counts[p.id]});
    });
    out.push({id:"__hom", label:"Homophones (there / their / they're)"});
    out.push({id:"__cmp", label:"Compound words"});
    return out;
  }

  /* Build a list to a set of boundaries: how many words, which grade level,
     which spelling rule, and never a word she already has. */
  function generate(opts){
    opts = opts || {};
    const count = Math.max(1, Math.min(30, opts.count || 12));
    const focus = opts.focus || "";
    const skip = new Set((opts.exclude || []).map(function(x){ return String(x).toLowerCase(); }));

    if(focus === "__hom"){
      const sets = shuf(HOMOPHONES.filter(function(set){
        return set.every(function(w){ return !skip.has(w) && BANK.has(w); });
      }));
      const out = [];
      for(const set of sets){
        if(out.length + set.length > count && out.length) break;
        set.forEach(function(w){ out.push(BANK.get(w)); });
        if(out.length >= count) break;
      }
      return out.slice(0, count);
    }

    const wanted = opts.grades && opts.grades.length ? opts.grades : [2,3,4,5];
    const match = function(e, grades){
      if(skip.has(e.w.toLowerCase())) return false;
      if(grades.indexOf(e.g) < 0) return false;
      if(focus === "__cmp") return e.f.indexOf("c") >= 0;
      if(focus) return patterns(e.w).some(function(p){ return p.id === focus; });
      return true;
    };

    let pool = [];
    BANK.forEach(function(e){ if(match(e, wanted)) pool.push(e); });

    /* If the boundaries are too tight to fill the list, widen the grade band by
       one step at a time rather than silently returning a short list. */
    let widen = wanted.slice();
    while(pool.length < count && widen.length < 4){
      const lo = Math.min.apply(null, widen), hi = Math.max.apply(null, widen);
      if(lo > 2) widen.push(lo - 1);
      else if(hi < 5) widen.push(hi + 1);
      else break;
      pool = [];
      BANK.forEach(function(e){ if(match(e, widen)) pool.push(e); });
    }
    return shuf(pool).slice(0, count);
  }

  return {chunks:chunks, patterns:patterns, mainPattern:mainPattern,
          sentenceFor:sentenceFor, parse:parse, PATTERNS:PATTERNS,
          generate:generate, focusOptions:focusOptions, bankSize:BANK.size};
})();

   {n:"Fizz",    b:"star", t:"flame",  p:"none",  e:"three", c:["#F97316","#9A3412","#FFEDD5"], tip:"When a word hisses at the end, add e-s to make it plural."},
   {n:"Puddle",  b:"wide", t:"none",   p:"belly", e:"sleepy",c:["#3B82F6","#1D4ED8","#DDEAFE"], tip:"An apostrophe stands exactly where the missing letters were."},
   {n:"Thorn",   b:"tall", t:"horn",   p:"spots", e:"two",   c:["#7C2D12","#431407","#F5E6DE"], tip:"kn, wr and mb hide a silent letter. Write it anyway."},
   {n:"Lumen",   b:"round",t:"flame",  p:"none",  e:"big",   c:["#EAB308","#854D0E","#FEF9C3"], tip:"y at the end of a long word usually says 'ee'."},
   {n:"Drift",   b:"egg",  t:"antenna",p:"belly", e:"wink",  c:["#06B6D4","#155E75","#CFFAFE"], tip:"Write it, check it, fix it. Fixing is where the learning happens."},
   {n:"Bramble", b:"star", t:"curls",  p:"spots", e:"two",   c:["#65A30D","#365314","#ECFCCB"], tip:"ph says f. Those words usually come from Greek."},
   {n:"Sable",   b:"tall", t:"ears",   p:"none",  e:"sleepy",c:["#4B5563","#1F2937","#EEF0F3"], tip:"Picture the word with your eyes closed before you write it."},
   {n:"Marigold",b:"round",t:"crown",  p:"belly", e:"big",   c:["#FB923C","#C2410C","#FFEDD5"], tip:"ough is a team of four letters. Learn it as one shape."},
   {n:"Kelp",    b:"wide", t:"fin",    p:"spots", e:"two",   c:["#0D9488","#134E4A","#D5F5F1"], tip:"Read the sentence. It tells you which their, there or they're you need."},
   {n:"Nova",    b:"star", t:"antenna",p:"none",  e:"three", c:["#8B5CF6","#4C1D95","#EDE4FF"], tip:"Spell it out loud, then write it. Two senses beat one."},
   {n:"Hazel",   b:"egg",  t:"leaf",   p:"spots", e:"wink",  c:["#B45309","#78350F","#FEF3D6"], tip:"i before e, except after c. But 'weird' is weird, and so are a few others."},
   {n:"Echo",    b:"round",t:"curls",  p:"belly", e:"sleepy",c:["#DB2777","#831843","#FCE7F3"], tip:"Come back to a word tomorrow, not just today. Spacing makes it stick."},
   {n:"Aurora",  b:"tall", t:"crown",  p:"spots", e:"big",   c:["#7C3AED","#4C1D95","#F3E8FF"], tip:"You have spelled every word in the app. Pick a new list and keep going."}
  ];

  /* --- geometry helpers --- */
  function smooth(pts){
    const n = pts.length;
    let d = "M " + pts[0][0].toFixed(1) + " " + pts[0][1].toFixed(1);
    for(let i = 0; i < n; i++){
      const p0 = pts[(i-1+n)%n], p1 = pts[i], p2 = pts[(i+1)%n], p3 = pts[(i+2)%n];
      const c1 = [p1[0] + (p2[0]-p0[0])/6, p1[1] + (p2[1]-p0[1])/6];
      const c2 = [p2[0] - (p3[0]-p1[0])/6, p2[1] - (p3[1]-p1[1])/6];
      d += " C " + c1[0].toFixed(1) + " " + c1[1].toFixed(1) + ", " +
                   c2[0].toFixed(1) + " " + c2[1].toFixed(1) + ", " +
                   p2[0].toFixed(1) + " " + p2[1].toFixed(1);
    }
    return d + " Z";
  }
  function blob(cx, cy, rx, ry, bumps, amp){
    const pts = [], N = bumps * 2;
    for(let i = 0; i < N; i++){
      const a = (i / N) * Math.PI * 2 - Math.PI / 2;
      const k = 1 + (i % 2 ? -amp : amp);
      pts.push([cx + Math.cos(a) * rx * k, cy + Math.sin(a) * ry * k]);
    }
    return smooth(pts);
  }

  const BODY = {
    round:{rx:30, ry:28, bumps:6, amp:.03},
    egg:  {rx:26, ry:32, bumps:5, amp:.02},
    tall: {rx:22, ry:34, bumps:6, amp:.04},
    wide: {rx:34, ry:23, bumps:7, amp:.05},
    star: {rx:28, ry:28, bumps:8, amp:.11}
  };

  function topper(kind, cx, top, c){
    const dark = c[1], body = c[0];
    switch(kind){
      case "antenna":
        return '<path d="M'+cx+' '+top+' q -2 -12 -8 -16" stroke="'+dark+'" stroke-width="3" fill="none" stroke-linecap="round"/>'+
               '<circle cx="'+(cx-9)+'" cy="'+(top-17)+'" r="5" fill="'+dark+'"/>';
      case "ears":
        return '<path d="M'+(cx-16)+' '+(top+6)+' q -6 -20 8 -16 z" fill="'+dark+'"/>'+
               '<path d="M'+(cx+16)+' '+(top+6)+' q 6 -20 -8 -16 z" fill="'+dark+'"/>';
      case "horn":
        return '<path d="M'+(cx-7)+' '+(top+2)+' L'+cx+' '+(top-17)+' L'+(cx+7)+' '+(top+2)+' z" fill="'+dark+'"/>';
      case "leaf":
        return '<path d="M'+cx+' '+top+' q -3 -9 -3 -13" stroke="'+dark+'" stroke-width="3" fill="none" stroke-linecap="round"/>'+
               '<ellipse cx="'+(cx+6)+'" cy="'+(top-14)+'" rx="10" ry="6" fill="'+dark+'" transform="rotate(-22 '+(cx+6)+' '+(top-14)+')"/>';
      case "flame":
        return '<path d="M'+cx+' '+(top-20)+' q 11 10 6 17 q -6 8 -12 0 q -5 -8 6 -17 z" fill="'+dark+'"/>';
      case "curls":
        return '<circle cx="'+(cx-11)+'" cy="'+(top-3)+'" r="7" fill="'+dark+'"/>'+
               '<circle cx="'+cx+'" cy="'+(top-9)+'" r="8" fill="'+dark+'"/>'+
               '<circle cx="'+(cx+11)+'" cy="'+(top-3)+'" r="7" fill="'+dark+'"/>';
      case "crown":
        return '<path d="M'+(cx-14)+' '+(top+1)+' L'+(cx-14)+' '+(top-13)+' L'+(cx-6)+' '+(top-5)+
               ' L'+cx+' '+(top-16)+' L'+(cx+6)+' '+(top-5)+' L'+(cx+14)+' '+(top-13)+' L'+(cx+14)+' '+(top+1)+' z" fill="'+dark+'"/>';
      case "fin":
        return '<path d="M'+cx+' '+(top-19)+' q 13 9 10 20 q -12 -4 -19 -8 q 3 -8 9 -12 z" fill="'+dark+'"/>';
      default: return "";
    }
  }

  function eyes(kind, cx, cy, dark){
    const w = "#FFFFFF";
    function eye(x, r){
      return '<circle cx="'+x+'" cy="'+cy+'" r="'+r+'" fill="'+w+'"/>'+
             '<circle cx="'+x+'" cy="'+(cy+1)+'" r="'+(r*.52).toFixed(1)+'" fill="#241F38"/>'+
             '<circle cx="'+(x+r*.3).toFixed(1)+'" cy="'+(cy-r*.35).toFixed(1)+'" r="'+(r*.2).toFixed(1)+'" fill="'+w+'"/>';
    }
    switch(kind){
      case "big":    return eye(cx-9, 8.5) + eye(cx+9, 8.5);
      case "three":  return eye(cx-11, 5.5) + eye(cx, 6.5) + eye(cx+11, 5.5);
      case "wink":   return eye(cx-8, 6.5) +
        '<path d="M'+(cx+3)+' '+cy+' q 5 4 10 0" stroke="#241F38" stroke-width="2.6" fill="none" stroke-linecap="round"/>';
      case "sleepy": return eye(cx-8, 6.5) + eye(cx+8, 6.5) +
        '<path d="M'+(cx-15)+' '+(cy-3)+' q 7 -4 14 0" stroke="'+dark+'" stroke-width="2.4" fill="none" stroke-linecap="round"/>'+
        '<path d="M'+(cx+1)+' '+(cy-3)+' q 7 -4 14 0" stroke="'+dark+'" stroke-width="2.4" fill="none" stroke-linecap="round"/>';
      default:       return eye(cx-8, 6.5) + eye(cx+8, 6.5);
    }
  }

  /* Draw one sprite. Index wraps, so the table can grow without breaking saves. */
  function draw(i, opts){
    opts = opts || {};
    const s = SPRITES[i % SPRITES.length];
    const B = BODY[s.b] || BODY.round;
    const cx = 50, cy = 56;
    const top = cy - B.ry;
    const light = s.c[2], body = s.c[0], dark = s.c[1];
    let g = "";

    /* feet first, so the body overlaps them */
    g += '<ellipse cx="'+(cx-13)+'" cy="'+(cy+B.ry-2)+'" rx="9" ry="6" fill="'+dark+'"/>';
    g += '<ellipse cx="'+(cx+13)+'" cy="'+(cy+B.ry-2)+'" rx="9" ry="6" fill="'+dark+'"/>';
    g += topper(s.t, cx, top, s.c);
    g += '<path d="'+blob(cx, cy, B.rx, B.ry, B.bumps, B.amp)+'" fill="'+body+'"/>';

    if(s.p === "belly")
      g += '<ellipse cx="'+cx+'" cy="'+(cy+B.ry*.34)+'" rx="'+(B.rx*.56)+'" ry="'+(B.ry*.44)+'" fill="'+light+'" opacity=".8"/>';
    if(s.p === "spots"){
      const spot = [[-.5,-.25,4],[.46,.1,3.4],[-.22,.42,3],[.2,-.5,2.6]];
      spot.forEach(function(p){
        g += '<circle cx="'+(cx+B.rx*p[0]).toFixed(1)+'" cy="'+(cy+B.ry*p[1]).toFixed(1)+'" r="'+p[2]+'" fill="'+light+'" opacity=".75"/>';
      });
    }
    /* cheeks + face */
    g += '<circle cx="'+(cx-17)+'" cy="'+(cy+6)+'" r="5" fill="#FF7A9A" opacity=".28"/>';
    g += '<circle cx="'+(cx+17)+'" cy="'+(cy+6)+'" r="5" fill="#FF7A9A" opacity=".28"/>';
    g += eyes(s.e, cx, cy - 3, dark);
    g += '<path d="M'+(cx-6)+' '+(cy+11)+' q 6 6 12 0" stroke="#241F38" stroke-width="2.6" fill="none" stroke-linecap="round"/>';

    const cls = opts.cls ? ' class="'+opts.cls+'"' : "";
    return '<svg viewBox="0 0 100 100"'+cls+' aria-hidden="true">'+g+'</svg>';
  }

  return {draw:draw, SPRITES:SPRITES, count:SPRITES.length};
})();


/* --------------------------------------------------------------------------
   SPEAK - dictation. Uses the browser's own voice, so it works offline once
   the page is cached. iOS needs one user gesture before it will make a sound,
   which is what the "Turn on the voice" button on first run is for.
   -------------------------------------------------------------------------- */
const SPEAK = (function(){
  const synth = window.speechSynthesis || null;
  let voice = null, unlocked = false;

  function pick(){
    if(!synth) return;
    const vs = synth.getVoices() || [];
    if(!vs.length) return;
    const en = vs.filter(function(v){ return /^en/i.test(v.lang); });
    const pool = en.length ? en : vs;
    const nice = ["Samantha","Karen","Moira","Serena","Allison","Ava","Google US English","Microsoft Aria"];
    for(const n of nice){
      const hit = pool.find(function(v){ return v.name.indexOf(n) === 0; });
      if(hit){ voice = hit; return; }
    }
    voice = pool.find(function(v){ return v.localService; }) || pool[0];
  }
  if(synth){
    pick();
    synth.addEventListener && synth.addEventListener("voiceschanged", pick);
  }

  function available(){ return !!synth; }
  function unlock(){
    if(!synth || unlocked) return;
    try{ const u = new SpeechSynthesisUtterance(" "); u.volume = 0; synth.speak(u); unlocked = true; }catch(e){}
  }
  function stop(){ if(synth) try{ synth.cancel(); }catch(e){} }

  /* Speaks each phrase in turn with a pause between, then calls done(). */
  function say(parts, opts){
    opts = opts || {};
    if(!synth){ if(opts.done) opts.done(); return; }
    stop();
    const list = (Array.isArray(parts) ? parts : [parts]).filter(Boolean);
    let i = 0;
    (function next(){
      if(i >= list.length){ if(opts.done) opts.done(); return; }
      const u = new SpeechSynthesisUtterance(String(list[i++]));
      if(voice) u.voice = voice;
      u.lang = (voice && voice.lang) || "en-US";
      u.rate = opts.rate || 0.82;
      u.pitch = 1.05;
      u.onend = function(){ setTimeout(next, opts.gap == null ? 420 : opts.gap); };
      u.onerror = function(){ setTimeout(next, 120); };
      try{ synth.speak(u); }catch(e){ next(); }
    })();
  }

  /* The standard classroom pattern: word, sentence, word again. */
  function dictate(word, sentence, opts){
    const parts = sentence ? [word, sentence, word] : [word, word];
    say(parts, opts);
  }
  function spellOut(word, opts){
    say([word.split("").join(", "), word], Object.assign({rate:0.7, gap:200}, opts || {}));
  }
  return {say:say, dictate:dictate, spellOut:spellOut, stop:stop, unlock:unlock, available:available};
})();


/* --------------------------------------------------------------------------
   HEAR - speaking the weekly list in, for when there is no photo to scan.
   Speech recognition returns the *common* spelling of what it hears, so it
   cannot tell "their" from "there" - every spoken word goes to the review
   screen to be checked, same as a scanned one. On a phone the system keyboard's
   own microphone key works just as well and is offered as the fallback.
   -------------------------------------------------------------------------- */
const HEAR = (function(){
  const R = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, wanted = false;

  function available(){ return !!R; }

  function start(onWord, onState){
    if(!R){ onState("unsupported"); return false; }
    stop();
    wanted = true;
    rec = new R();
    rec.lang = "en-US";
    rec.continuous = true;
    rec.interimResults = false;
    rec.maxAlternatives = 1;
    rec.onresult = function(e){
      for(let i = e.resultIndex; i < e.results.length; i++){
        if(e.results[i].isFinal) onWord(e.results[i][0].transcript);
      }
    };
    rec.onerror = function(e){
      const fatal = e.error === "not-allowed" || e.error === "service-not-allowed";
      if(fatal){ wanted = false; onState("denied"); }
      else if(e.error !== "no-speech") onState("error", e.error);
    };
    /* Safari ends the session after each pause; restart while she still wants it on. */
    rec.onend = function(){
      if(wanted){ try{ rec.start(); }catch(err){ wanted = false; onState("ended"); } }
      else onState("ended");
    };
    try{ rec.start(); onState("listening"); }
    catch(err){ wanted = false; onState("error", String(err)); return false; }
    return true;
  }

  function stop(){
    wanted = false;
    if(rec){ try{ rec.onend = null; rec.stop(); }catch(e){} rec = null; }
  }
  function isOn(){ return wanted; }
  return {available:available, start:start, stop:stop, isOn:isOn};
})();


/* --------------------------------------------------------------------------
   SFX - short generated tones. No audio files, nothing to load.
   The "not yet" sound is deliberately gentle: an error here is information,
   not a punishment.
   -------------------------------------------------------------------------- */
const SFX = (function(){
  let ctx = null;
  function on(){ return !DB || DB.profile.sound !== false; }
  function ac(){
    if(!ctx){
      const C = window.AudioContext || window.webkitAudioContext;
      if(!C) return null;
      ctx = new C();
    }
    if(ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  function tone(freq, at, dur, vol, type){
    const c = ac(); if(!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(0, c.currentTime + at);
    g.gain.linearRampToValueAtTime(vol, c.currentTime + at + .02);
    g.gain.exponentialRampToValueAtTime(.0001, c.currentTime + at + dur);
    o.connect(g); g.connect(c.destination);
    o.start(c.currentTime + at); o.stop(c.currentTime + at + dur + .05);
  }
  return {
    good:function(){ if(!on()) return; [523.25,659.25,783.99].forEach(function(f,i){ tone(f, i*.075, .3, .16); }); },
    soft:function(){ if(!on()) return; tone(392, 0, .22, .12, "triangle"); tone(330, .1, .26, .1, "triangle"); },
    hatch:function(){ if(!on()) return; [659,784,988,1319].forEach(function(f,i){ tone(f, i*.09, .45, .15); }); },
    tick:function(){ if(!on()) return; tone(880, 0, .06, .07, "square"); },
    unlock:function(){ try{ ac(); }catch(e){} }
  };
})();


/* --------------------------------------------------------------------------
   OCR - photo to text.
   On iPhone the reliable path is Apple Live Text: photograph the list, hold to
   select the words, Copy, then paste here. It handles handwriting, which
   engine-based OCR mostly does not. Tesseract is offered as a fallback for
   clean printed handouts and is only downloaded if it is actually used.
   -------------------------------------------------------------------------- */
const OCR = (function(){
  const SRC = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
  let loading = null;
  function load(){
    if(window.Tesseract) return Promise.resolve();
    if(loading) return loading;
    loading = new Promise(function(res, rej){
      const s = document.createElement("script");
      s.src = SRC; s.onload = res;
      s.onerror = function(){ loading = null; rej(new Error("offline")); };
      document.head.appendChild(s);
    });
    return loading;
  }
  /* Grayscale, stretch the contrast and upscale a little. A phone photo of a
     printed handout reads far better after this than it does raw. */
  function prep(file){
    return new Promise(function(res){
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = function(){
        URL.revokeObjectURL(url);
        const scale = Math.min(2, Math.max(1, 1600 / (img.width || 1600)));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * scale);
        c.height = Math.round(img.height * scale);
        const x = c.getContext("2d");
        x.drawImage(img, 0, 0, c.width, c.height);
        try{
          const d = x.getImageData(0, 0, c.width, c.height), px = d.data;
          let min = 255, max = 0;
          const g = new Uint8ClampedArray(px.length / 4);
          for(let i = 0, j = 0; i < px.length; i += 4, j++){
            const v = (px[i] * 0.299 + px[i+1] * 0.587 + px[i+2] * 0.114) | 0;
            g[j] = v; if(v < min) min = v; if(v > max) max = v;
          }
          const range = Math.max(1, max - min);
          for(let i = 0, j = 0; i < px.length; i += 4, j++){
            const v = ((g[j] - min) / range) * 255;
            const o = v < 128 ? v * 0.55 : Math.min(255, 128 + (v - 128) * 1.7);
            px[i] = px[i+1] = px[i+2] = o;
          }
          x.putImageData(d, 0, 0);
        }catch(e){ /* tainted canvas or no memory: read the plain photo instead */ }
        c.toBlob(function(b){ res(b || file); }, "image/png");
      };
      img.onerror = function(){ URL.revokeObjectURL(url); res(file); };
      img.src = url;
    });
  }

  function read(file, onProgress){
    return load().then(function(){ return prep(file); }).then(function(clean){
      return window.Tesseract.recognize(clean, "eng", {
        logger:function(m){
          if(m.status === "recognizing text" && onProgress) onProgress(Math.round(m.progress * 100));
        }
      });
    }).then(function(r){ return (r && r.data && r.data.text) || ""; });
  }
  return {read:read};
})();


/* ============================== 4. APP ================================== */

/* --- store ---------------------------------------------------------------- */
const KEY = "spell.db";
const INTERVALS = [0, 1, 2, 4, 7, 14];   /* Leitner box -> days until due */
const MASTER_BOX = 5;

function blank(){
  return {
    v:1,
    profile:{name:"Emily", sessionSize:8, newPerSession:3, rate:0.82, sound:true, big:false,
             hints:true, focusList:true, reviewOld:false, wholeList:false},
    lists:[], words:[], log:[], activeListId:"",
    gems:0, sprites:0, streak:0, lastPlayed:"", best:0
  };
}
let DB = blank();

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const d = JSON.parse(raw);
      DB = Object.assign(blank(), d);
      DB.profile = Object.assign(blank().profile, d.profile || {});
    }
  }catch(e){ DB = blank(); }
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){} }

/* --- dates ---------------------------------------------------------------- */
function pad(n){ return n < 10 ? "0" + n : "" + n; }
function today(){ const d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
function addDays(iso, n){
  const p = iso.split("-").map(Number);
  const d = new Date(p[0], p[1]-1, p[2]);
  d.setDate(d.getDate() + n);
  return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
}
function daysBetween(a, b){
  const pa = a.split("-").map(Number), pb = b.split("-").map(Number);
  return Math.round((new Date(pb[0],pb[1]-1,pb[2]) - new Date(pa[0],pa[1]-1,pa[2])) / 86400000);
}

/* --- small helpers -------------------------------------------------------- */
function uid(){ return Math.random().toString(36).slice(2, 9); }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function el(id){ return document.getElementById(id); }
function shuffle(a){ for(let i = a.length - 1; i > 0; i--){ const j = (Math.random()*(i+1))|0; const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function words(){ return DB.words; }
function wordById(id){ return DB.words.find(function(w){ return w.id === id; }); }
function listById(id){ return DB.lists.find(function(l){ return l.id === id; }); }
function plural(n, s, p){ return n + " " + (n === 1 ? s : (p || s + "s")); }

/* --- word state ----------------------------------------------------------- */
function newWord(text, sentence, listId){
  return {
    id:uid(), listId:listId, text:text.trim(),
    sentence:(sentence || LEX.sentenceFor(text) || "").trim(),
    box:0, due:today(), seen:0, right:0, wrong:0, days:[],
    created:today(), lastSeen:"", g3:false, g5:false, misses:[]
  };
}
function isMastered(w){ return w.box >= MASTER_BOX; }

/* A word with a test on Friday is no use to her if the scheduler parks it for
   fourteen days. Never let a review land after the test it is for. */
function capToTest(w, t){
  const l = listById(w.listId);
  if(!l || !l.testDate || l.testDate < t) return;
  if(w.due > l.testDate) w.due = l.testDate;
}
/* Days until this word's test, or 99 if it has none. */
function testIn(w){
  const l = listById(w.listId);
  if(!l || !l.testDate) return 99;
  const d = daysBetween(today(), l.testDate);
  return d < 0 ? 99 : d;
}
/* The soonest upcoming test, with how ready she is for it. */
function nextTest(){
  const t = today();
  let best = null;
  DB.lists.forEach(function(l){
    if(!l.testDate || l.testDate < t) return;
    if(!best || l.testDate < best.testDate) best = l;
  });
  if(!best) return null;
  const ws = words().filter(function(w){ return w.listId === best.id; });
  return {list:best, days:daysBetween(t, best.testDate), total:ws.length,
          shaky:ws.filter(function(w){ return w.box < 3; }).length};
}
function statusOf(w){
  if(w.seen === 0) return {k:"new", t:"New"};
  if(isMastered(w)) return {k:"mast", t:"Mastered"};
  if(w.wrong >= 3 && w.wrong > w.right) return {k:"hard", t:"Tricky"};
  return {k:"learn", t:"Learning"};
}
function dueWords(){
  const t = today();
  return practicePool().filter(function(w){ return w.seen > 0 && w.due <= t; });
}
function freshWords(){ return practicePool().filter(function(w){ return w.seen === 0; }); }

/* The words practice is allowed to draw from.
   Her teacher hands out a list every week and that list IS the assignment, so
   by default practice uses exactly those words and nothing else. Turning
   "review older lists" on in Grown-ups widens it, at the cost of spending part
   of each session on words that are not on this week's test. */
function activeList(){
  return listById(DB.activeListId) || DB.lists[DB.lists.length - 1] || null;
}
function practicePool(){
  if(DB.profile.focusList === false || DB.profile.reviewOld) return words();
  const l = activeList();
  if(!l) return words();
  const only = words().filter(function(w){ return w.listId === l.id; });
  return only.length ? only : words();
}

/* --- gems and hatching ---------------------------------------------------- */
const GEMS_PER_EGG = 5;
function addGems(n){
  DB.gems += n;
  const earned = Math.min(ART.count, Math.floor(DB.gems / GEMS_PER_EGG));
  const hatched = earned > DB.sprites;
  DB.sprites = earned;
  return hatched;
}
function eggProgress(){ return DB.gems % GEMS_PER_EGG; }

/* --- streak --------------------------------------------------------------- */
function touchStreak(){
  const t = today();
  if(DB.lastPlayed === t) return;
  if(DB.lastPlayed && daysBetween(DB.lastPlayed, t) === 1) DB.streak++;
  else DB.streak = 1;
  DB.lastPlayed = t;
}

/* --- letter alignment ----------------------------------------------------- */
/* Levenshtein with backtrace, so the compare screen can show exactly which
   letters went wrong. Self-correction at the letter level is the active
   ingredient in the corrected-test method. */
function align(attempt, target){
  const a = attempt, b = target, m = a.length, n = b.length;
  const d = [];
  for(let i = 0; i <= m; i++){ d.push(new Array(n + 1).fill(0)); d[i][0] = i; }
  for(let j = 0; j <= n; j++) d[0][j] = j;
  const same = function(i, j){ return a[i-1].toLowerCase() === b[j-1].toLowerCase(); };
  for(let i = 1; i <= m; i++)
    for(let j = 1; j <= n; j++)
      d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (same(i,j) ? 0 : 1));

  const ops = [];
  let i = m, j = n;
  while(i > 0 || j > 0){
    if(i > 0 && j > 0 && d[i][j] === d[i-1][j-1] + (same(i,j) ? 0 : 1)){
      ops.push({t:same(i,j) ? "eq" : "sub", a:a[i-1], b:b[j-1]}); i--; j--;
    }else if(i > 0 && d[i][j] === d[i-1][j] + 1){
      ops.push({t:"extra", a:a[i-1]}); i--;
    }else{
      ops.push({t:"missing", b:b[j-1]}); j--;
    }
  }
  return ops.reverse();
}
function renderAttempt(ops){
  return ops.map(function(o){
    if(o.t === "eq")      return '<span class="ok">' + esc(o.a) + "</span>";
    if(o.t === "sub")     return '<span class="bad">' + esc(o.a) + "</span>";
    if(o.t === "extra")   return '<span class="bad">' + esc(o.a) + "</span>";
    return '<span class="miss">_</span>';
  }).join("");
}
function renderTarget(ops){
  return ops.map(function(o){
    if(o.t === "eq")   return '<span class="ok">' + esc(o.b) + "</span>";
    if(o.t === "extra") return "";
    return '<span class="fix">' + esc(o.b) + "</span>";
  }).join("");
}
function sameWord(a, b){
  return String(a).trim().toLowerCase().replace(/’/g, "'") ===
         String(b).trim().toLowerCase().replace(/’/g, "'");
}

/* --- letter blanking for the fading-hint stage ---------------------------- */
function blanked(word, keepRatio){
  const chars = word.split("");
  const idx = [];
  chars.forEach(function(c, i){ if(/[a-z']/i.test(c)) idx.push(i); });
  const hide = Math.max(1, Math.round(idx.length * (1 - keepRatio)));
  const pickFrom = shuffle(idx.slice());
  const hidden = new Set(pickFrom.slice(0, hide));
  return chars.map(function(c, i){
    return hidden.has(i) ? '<span class="blank">•</span>' : '<span class="ok">' + esc(c) + "</span>";
  }).join("");
}

let view = "home";
const RENDER = {};
function go(v){
  view = v;
  document.querySelectorAll(".view").forEach(function(s){ s.classList.remove("on"); });
  el("v-" + v).classList.add("on");
  document.querySelectorAll("#tabs button").forEach(function(b){
    b.classList.toggle("on", b.dataset.go === v);
  });
  window.scrollTo(0, 0);
  if(RENDER[v]) RENDER[v]();
}
document.querySelectorAll("#tabs button").forEach(function(b){
  b.addEventListener("click", function(){ SFX.unlock(); SPEAK.unlock(); go(b.dataset.go); });
});

function renderOneList(v){
  const l = listById(openList);
  if(!l){ openList = null; return RENDER.lists(); }
  const ws = words().filter(function(w){ return w.listId === l.id; });

  const unseen = ws.filter(function(w){ return w.seen === 0; }).length;
  const sessions = Math.ceil(unseen / Math.max(1, DB.profile.newPerSession));
  let h = '<div class="row" style="margin:6px 0 12px">' +
            '<button class="iconbtn" data-act="backlist">‹</button>' +
            "<h2 style='margin:0;flex:1'>" + esc(l.title) + "</h2>" +
          "</div>";

  if(l.testDate || unseen){
    const d = l.testDate ? daysBetween(today(), l.testDate) : null;
    h += '<div class="note" style="margin-bottom:12px">' +
      (l.testDate && d >= 0 ? "<b>Test in " + plural(d, "day") + ".</b> " : "") +
      (DB.profile.wholeList
        ? "All " + plural(ws.length, "word") + " come up in every session."
        : unseen ? "At " + DB.profile.newPerSession + " new words a session, this list takes " +
                   plural(sessions, "session") + " to introduce" +
                   (l.testDate && d >= 0 && sessions > d + 1 ?
                     " — more than the days left. Switch <i>each session covers</i> to <i>the whole list</i> in Grown-ups, or raise <i>new words per session</i>, otherwise she meets some of these for the first time on test day." :
                     ".")
                 : "All of these have been introduced.") +
      "</div>";
  }
  h += '<div class="card flat" style="padding:10px 14px">';

  if(!ws.length){
    h += '<p class="muted" style="margin:8px 0">No words in this list.</p>';
  }else{
    ws.forEach(function(w){
      const st = statusOf(w);
      h += '<div class="wrow">' +
             '<div class="grow"><div class="wt">' + esc(w.text) + "</div>" +
             (w.sentence ? '<div class="tiny">' + esc(w.sentence) + "</div>" : '<div class="tiny" style="opacity:.7">no sentence yet</div>') +
             "</div>" +
             '<span class="badge ' + st.k + '">' + st.t + "</span>" +
             '<button class="iconbtn" data-say="' + w.id + '" aria-label="Hear it">🔊</button>' +
           "</div>";
    });

  const isActive = activeList() && activeList().id === l.id;
  h += "</div>" +
       (isActive
         ? '<p class="tiny center" style="margin:0 0 10px">Practice is using this list.</p>'
         : '<button class="btn wide" data-act="setactive" style="margin-bottom:10px">Practise this list</button>') +
       '<button class="btn ghost wide" data-act="addto" style="margin-bottom:10px">+ Add more words</button>' +
       '<button class="btn ghost wide" data-act="dellist">Delete this list</button>';
  v.innerHTML = h;
}

/* --- add words flow ------------------------------------------------------- */
let draft = null;   /* {title, listId, mode, words:[{text,sentence}]} */

function startAdd(listId){
  draft = {title:suggestTitle(), listId:listId || null, mode:"photo", words:[], busy:false, msg:"", heard:[],
           testDate:listId ? ((listById(listId) || {}).testDate || "") : nextFriday(),
           gen:{count:12, grade:"", focus:""}};
  go("lists");
  renderAdd();
}
function suggestTitle(){
  const d = new Date();
  return "Week of " + d.toLocaleDateString(undefined, {month:"short", day:"numeric"});
}
/* School lists are usually tested on a Friday, so that is the default. */
function nextFriday(){
  const d = new Date();
  d.setDate(d.getDate() + ((5 - d.getDay() + 7) % 7 || 7));
  return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
}

function onPhoto(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  if(el("f-title")) draft.title = el("f-title").value.trim() || draft.title;
  draft.busy = true; draft.msg = "Reading the photo…";
  renderAdd();
  OCR.read(file, function(p){
    const b = el("ocr-bar"); if(b) b.style.width = p + "%";
  }).then(function(text){
    const found = LEX.parse(text);
    draft.busy = false;
    if(!found.length){
      draft.msg = "No clear words in that photo. Try again with more light and the list flat in frame — or use Paste, which uses the iPhone's own text recognition and handles handwriting.";
      renderAdd();
    }else{
      draft.words = found.map(function(t){ return {text:t, sentence:LEX.sentenceFor(t)}; });
      draft.msg = "";
      renderAdd();
    }
  }).catch(function(){
    draft.busy = false;
    draft.msg = "The scanner needs an internet connection the first time. Use Paste instead — it works offline and reads handwriting.";
    renderAdd();
  });
}

  });

  h += '<button class="btn ghost wide" data-act="addrow" style="margin-bottom:10px">+ Add another word</button>' +
       '<button class="btn go wide big" data-act="saveList">Save ' + plural(d.words.length, "word") + "</button>";
  v.innerHTML = h;
}

function collectReview(){
  document.querySelectorAll("[data-w]").forEach(function(inp){
    draft.words[+inp.dataset.w].text = inp.value.trim();
  });
  document.querySelectorAll("[data-s]").forEach(function(inp){
    draft.words[+inp.dataset.s].sentence = inp.value.trim();
  });
}

function saveDraft(){
  HEAR.stop();
  collectReview();
  const clean = draft.words.filter(function(w){ return w.text.length > 1; });
  if(!clean.length){ alert("No words to save yet."); return; }

  if(el("f-test")) draft.testDate = el("f-test").value;
  let listId = draft.listId;
  if(!listId){
    const t = draft.title;
    const l = {id:uid(), title:t || suggestTitle(), created:today(), testDate:draft.testDate || ""};
    DB.lists.push(l);
    listId = l.id;
  }else if(draft.testDate){
    const l = listById(listId); if(l) l.testDate = draft.testDate;
  }
  const existing = new Set(words().filter(function(w){ return w.listId === listId; })
                                  .map(function(w){ return w.text.toLowerCase(); }));
  clean.forEach(function(w){
    if(existing.has(w.text.toLowerCase())) return;
    DB.words.push(newWord(w.text, w.sentence, listId));
  });
  DB.activeListId = listId;      /* the list you just added is the one she practises */
  save();
  draft = null; openList = listId;
  go("lists");
}

/* ==========================================================================
   PRACTICE SESSION
   The loop is the same at every scaffold level: retrieve, compare, correct.
   What changes is how much support is on screen when she retrieves.
     meet   - word visible, copy it (first contact)
     fade   - word shown with letters missing
     ccc    - word shown, then hidden (cover-copy-compare)
     recall - audio only, nothing on screen
   ========================================================================== */
let S = null;

/* Every word on the list, every session.
   The scaffold level still comes from each word's box, so a word she has never
   met is introduced properly while one she nearly owns is straight dictation.
   One encounter per word keeps the session about the length of a real spelling
   practice; the box rules are untouched, so mastery still needs five separate
   days and cannot be rushed by seeing everything more often. */
function buildWholeList(){
  const pool = practicePool().slice().sort(function(a, b){
    return testIn(a) - testIn(b) || a.box - b.box;
  });
  if(!pool.length) return [];
  return shuffle(pool.map(function(w){
    return {wid:w.id, stage:w.seen === 0 ? "meet" : (w.box <= 2 ? "ccc" : "recall")};
  }));
}

function buildSession(){
  if(DB.profile.wholeList){
    const all = buildWholeList();
    if(all.length) return all;
  }
  const size = DB.profile.sessionSize;
  const maxNew = DB.profile.newPerSession;
  const fresh = freshWords().slice(0, maxNew);
  const room = Math.max(0, size - fresh.length);
  let due = dueWords().sort(function(a, b){
    return testIn(a) - testIn(b) || a.box - b.box || a.due.localeCompare(b.due);
  }).slice(0, room);

  /* With a test within three days, pull in that list's shakiest words even if
     the schedule would not have surfaced them yet. */
  if(due.length < room){
    const chosen = new Set(due.map(function(w){ return w.id; }));
    const urgent = words().filter(function(w){
      return !chosen.has(w.id) && w.seen > 0 && w.box < 4 && testIn(w) <= 3;
    }).sort(function(a, b){ return a.box - b.box; });
    due = due.concat(urgent.slice(0, room - due.length));
  }

  let items = [];
  if(!fresh.length && !due.length){
    /* nothing scheduled: a light refresher on the weakest words */
    const pool = words().slice().sort(function(a, b){ return a.box - b.box; }).slice(0, size);
    items = pool.map(function(w){ return {wid:w.id, stage:w.box <= 2 ? "ccc" : "recall"}; });
    return shuffle(items);
  }

  const dueItems = due.map(function(w){ return {wid:w.id, stage:w.box <= 2 ? "ccc" : "recall"}; });
  const half = Math.ceil(dueItems.length / 2);

  /* Three spaced encounters per new word, with review words interleaved
     between them. Spacing inside the session, not just across days. */
  const A = fresh.map(function(w){ return {wid:w.id, stage:"meet"}; });
  const B = shuffle(fresh.map(function(w){ return {wid:w.id, stage:"fade"}; }).concat(dueItems.slice(0, half)));
  const C = shuffle(fresh.map(function(w){ return {wid:w.id, stage:"recall"}; }).concat(dueItems.slice(half)));
  return A.concat(B, C);
}

function startSession(){
  if(!words().length){ startAdd(null); return; }
  SPEAK.unlock(); SFX.unlock();
  S = {items:buildSession(), i:0, right:0, wrong:0, start:Date.now(), gems:0, hatched:false, phase:"ask", ops:null, attempt:""};
  if(!S.items.length){ S = null; alert("No words available yet."); return; }
  document.body.classList.add("playing");
  go("play");
}
function endSession(){
  document.body.classList.remove("playing");
  SPEAK.stop();
  S = null;
  go("home");
}

RENDER.play = function(){
  if(!S){ endSession(); return; }
  const v = el("v-play");
  if(S.i >= S.items.length) return renderDone(v);

  const it = S.items[S.i];
  const w = wordById(it.wid);
  if(!w){ S.i++; return RENDER.play(); }

  const progress = Math.round(S.i / S.items.length * 100);
  const head =
    '<div class="row" style="margin:6px 0 14px">' +
      '<button class="iconbtn" data-act="quit" aria-label="Stop">✕</button>' +
      '<div class="grow"><div class="bar"><i style="width:' + progress + '%"></i></div></div>' +
      '<span class="tiny">' + (S.i + 1) + "/" + S.items.length + "</span>" +
    "</div>";

  if(S.phase === "ask")     return v.innerHTML = head + askCard(w, it), afterRender(w, it);
  if(S.phase === "judge")   return v.innerHTML = head + judgeCard(w, it), afterJudge(w, it);
  if(S.phase === "correct") return v.innerHTML = head + correctCard(w, it), afterRender(w, it, true);
};

function askCard(w, it){
  const pats = LEX.patterns(w.text);
  const ch = LEX.chunks(w.text);
  let body = "";

  if(it.stage === "meet"){
    body =
      '<p class="tiny center" style="margin:0 0 6px;text-transform:uppercase;letter-spacing:.08em;font-weight:800">New word</p>' +
      '<div class="word xl" style="margin-bottom:12px">' + esc(w.text) + "</div>" +
      (ch.length > 1 ? '<div class="chips" style="margin-bottom:12px">' + ch.map(function(c){ return '<span class="chip">' + esc(c) + "</span>"; }).join("") + "</div>" : "") +
      '<div class="row" style="justify-content:center;gap:8px;margin-bottom:14px">' +
        '<button class="btn ghost sm" data-act="hear">🔊 Hear it</button>' +
        '<button class="btn ghost sm" data-act="spell">🔤 Spell it out</button>' +
      "</div>" +
      (DB.profile.hints && pats.length ?
        '<div class="note" style="margin-bottom:14px"><b>' + esc(pats[0].label) + ".</b> " + esc(pats[0].tip) + "</div>" : "") +
      '<p class="tiny center" style="margin-bottom:6px">Now type it while you look at it.</p>';
  }

  if(it.stage === "fade"){
    body =
      '<p class="tiny center" style="margin:0 0 6px;text-transform:uppercase;letter-spacing:.08em;font-weight:800">Fill the gaps</p>' +
      '<div class="word xl" style="margin-bottom:14px">' + blanked(w.text, 0.55) + "</div>" +
      '<div class="row" style="justify-content:center;margin-bottom:14px">' +
        '<button class="btn ghost sm" data-act="hear">🔊 Hear it</button>' +
      "</div>";
  }

  if(it.stage === "ccc"){
    body =
      '<p class="tiny center" style="margin:0 0 6px;text-transform:uppercase;letter-spacing:.08em;font-weight:800">Look, cover, write</p>' +
      '<div id="peek" class="word xl" style="margin-bottom:14px">' + esc(w.text) + "</div>" +
      '<div class="row" style="justify-content:center;margin-bottom:14px">' +
        '<button class="btn ghost sm" data-act="hear">🔊 Hear it</button>' +
      "</div>";
  }

  if(it.stage === "recall"){
    body =
      '<p class="tiny center" style="margin:0 0 6px;text-transform:uppercase;letter-spacing:.08em;font-weight:800">Listen and spell</p>' +
      '<div class="center" style="font-size:52px;margin:6px 0 10px">🎧</div>' +
      '<div class="row" style="justify-content:center;gap:8px;margin-bottom:14px">' +
        '<button class="btn ghost sm" data-act="hear">🔊 Say it again</button>' +
      "</div>" +
      (SPEAK.available() && !it.shown ?
        '<p class="center" style="margin:0 0 14px"><button class="tiny" data-act="reveal" style="text-decoration:underline">Can\'t hear it? Show me the word</button></p>' :
        '<div class="word lg" style="margin-bottom:14px">' + esc(w.text) + "</div>");
  }

  return '<div class="card">' + body +
    '<input class="answer" id="ans" type="text" autocapitalize="off" autocomplete="off" ' +
      'autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="type here">' +
    '<button class="btn go wide big" data-act="submit" style="margin-top:12px">Check it</button>' +
  "</div>";
}

function judgeCard(w, it){
  const ok = sameWord(S.attempt, w.text);
  if(ok){
    return '<div class="card center pop">' +
             '<div class="verdict yes">✓ Yes! That is exactly right.</div>' +
             '<div class="word xl" style="margin-bottom:8px">' + esc(w.text) + "</div>" +
             (w.sentence ? '<p class="tiny">' + esc(w.sentence) + "</p>" : "") +
             '<button class="btn go wide big" data-act="next" style="margin-top:12px">Next →</button>' +
           "</div>";
  }
  const ops = S.ops;
  const pats = LEX.patterns(w.text);
  return '<div class="card">' +
           '<div class="verdict no">Not yet — look at the difference</div>' +
           '<p class="tiny center" style="margin-bottom:2px">You wrote</p>' +
           '<div class="word lg" style="margin-bottom:12px">' + renderAttempt(ops) + "</div>" +
           '<p class="tiny center" style="margin-bottom:2px">The word is</p>' +
           '<div class="word xl" style="margin-bottom:12px">' + renderTarget(ops) + "</div>" +
           (DB.profile.hints && pats.length ?
             '<div class="note" style="margin-bottom:12px"><b>' + esc(pats[0].label) + ".</b> " + esc(pats[0].tip) + "</div>" : "") +
           '<div class="row" style="justify-content:center;margin-bottom:12px">' +
             '<button class="btn ghost sm" data-act="spell">🔤 Spell it out</button>' +
           "</div>" +
           '<button class="btn wide big" data-act="fix">Now write it correctly →</button>' +
         "</div>";
}

function correctCard(w){
  return '<div class="card">' +
           '<p class="tiny center" style="margin:0 0 8px;text-transform:uppercase;letter-spacing:.08em;font-weight:800">Write it correctly</p>' +
           '<div class="word xl" style="margin-bottom:14px">' + esc(w.text) + "</div>" +
           '<div class="row" style="justify-content:center;margin-bottom:14px">' +
             '<button class="btn ghost sm" data-act="hear">🔊 Hear it</button>' +
           "</div>" +
           '<input class="answer" id="ans" type="text" autocapitalize="off" autocomplete="off" ' +
             'autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="type it">' +
           '<button class="btn go wide big" data-act="submitfix" style="margin-top:12px">Check it</button>' +
         "</div>";
}

function afterRender(w, it, isFix){
  const a = el("ans");
  if(a){ a.value = ""; setTimeout(function(){ a.focus(); }, 60); }

  /* cover-copy-compare: the word is visible only briefly */
  if(!isFix && it.stage === "ccc"){
    const peek = el("peek");
    SPEAK.dictate(w.text, "", {rate:DB.profile.rate});
    setTimeout(function(){
      if(peek) peek.innerHTML = '<span style="opacity:.25">•••</span>';
    }, 4000);
  }
  if(!isFix && it.stage === "recall"){
    setTimeout(function(){ SPEAK.dictate(w.text, w.sentence, {rate:DB.profile.rate}); }, 250);
  }
  if(!isFix && it.stage === "meet"){
    setTimeout(function(){ SPEAK.dictate(w.text, w.sentence, {rate:DB.profile.rate}); }, 250);
  }
}
function afterJudge(w){
  if(sameWord(S.attempt, w.text)) SFX.good(); else SFX.soft();
}

function submitAnswer(){
  const a = el("ans"); if(!a) return;
  S.attempt = a.value.trim();
  if(!S.attempt) return;
  const it = S.items[S.i], w = wordById(it.wid);
  const ok = sameWord(S.attempt, w.text);
  S.ops = align(S.attempt, w.text);
  if(!ok) recordMisses(w, S.ops);
  gradeWord(w, ok, it.stage, it.shown);
  if(ok) S.right++; else S.wrong++;
  S.phase = "judge";
  SPEAK.stop();
  RENDER.play();
}
function submitFix(){
  const a = el("ans"); if(!a) return;
  const it = S.items[S.i], w = wordById(it.wid);
  if(!sameWord(a.value.trim(), w.text)){
    SFX.soft();
    a.value = "";
    a.placeholder = "not quite — try again";
    a.focus();
    return;
  }
  SFX.good();
  /* Re-ask this word later in the same session: an error corrected once is
     not yet learned. */
  const at = Math.min(S.items.length, S.i + 4);
  S.items.splice(at, 0, {wid:w.id, stage:"recall", retry:true});
  nextItem();
}
function nextItem(){
  S.i++; S.phase = "ask"; S.attempt = ""; S.ops = null;
  SPEAK.stop();
  RENDER.play();
}

function recordMisses(w, ops){
  ops.forEach(function(o){
    if(o.t === "sub")     w.misses.push(o.b + "→" + o.a);
    if(o.t === "missing") w.misses.push("missed " + o.b);
  });
  if(w.misses.length > 24) w.misses = w.misses.slice(-24);
}

function gradeWord(w, ok, stage, shown){
  const t = today();
  w.seen++; w.lastSeen = t;
  if(ok) w.right++; else w.wrong++;

  /* Only unsupported retrieval moves the schedule. Copying a word you can see
     is practice, not evidence of memory. */
  if(stage !== "recall" && stage !== "ccc"){ save(); return; }
  if(shown){ save(); return; }

  if(ok){
    const newDay = w.days.indexOf(t) < 0;
    if(newDay) w.days.push(t);
    /* Past box 2, a promotion requires a correct answer on a *different* day,
       so mastery cannot be faked inside one long sitting. */
    if(w.box < 2 || newDay || w.days.length > w.box){
      if(w.box < MASTER_BOX) w.box++;
    }
    w.due = addDays(t, INTERVALS[w.box]);
    capToTest(w, t);
    if(w.box >= 3 && !w.g3){ w.g3 = true; if(S) S.gems += 1; }
    if(w.box >= MASTER_BOX && !w.g5){ w.g5 = true; if(S) S.gems += 2; }
  }else{
    w.box = Math.max(0, w.box - 2);
    w.due = t;
  }
  save();
}

function renderDone(v){
  const secs = Math.round((Date.now() - S.start) / 1000);
  const total = S.right + S.wrong;
  const pct = total ? Math.round(S.right / total * 100) : 0;

  if(!S.closed){
    S.closed = true;
    S.gems += 1;                                    /* finishing counts */
    touchStreak();
    if(DB.streak > 0 && DB.streak % 7 === 0) S.gems += 3;
    S.hatched = addGems(S.gems);
    if(pct > DB.best) DB.best = pct;
    DB.log.push({d:today(), n:total, right:S.right, sec:secs});
    if(DB.log.length > 400) DB.log = DB.log.slice(-400);
    save(); chrome();
    if(S.hatched) setTimeout(function(){ SFX.hatch(); }, 350);
  }

  const newest = Math.max(0, DB.sprites - 1);
  v.innerHTML =
    '<div class="card center pop">' +
      "<h2 style='margin:2px 0 4px'>Practice done 🎉</h2>" +
      '<p class="muted" style="margin:0 0 14px">' + S.right + " right out of " + total + " · " + pct + "%</p>" +
      '<div class="stats" style="margin-bottom:14px">' +
        '<div class="s"><b>+' + S.gems + "</b><span>gems</span></div>" +
        '<div class="s"><b>' + DB.streak + "</b><span>day streak</span></div>" +
        '<div class="s"><b>' + words().filter(isMastered).length + "</b><span>mastered</span></div>" +
      "</div>" +
      (S.hatched ?
        '<div class="card flat" style="margin:0 0 12px;background:var(--gold-soft);border-color:transparent">' +
          "<p style='font-weight:800;margin:0 0 6px'>An egg hatched!</p>" +
          "<div style='width:130px;margin:0 auto'>" + ART.draw(newest) + "</div>" +
          "<p style='font-weight:800;margin:6px 0 2px'>" + esc(ART.SPRITES[newest % ART.count].n) + "</p>" +
          '<p class="tiny" style="margin:0">"' + esc(ART.SPRITES[newest % ART.count].tip) + '"</p>' +
        "</div>" :
        '<div class="bar teal" style="margin-bottom:6px"><i style="width:' + (eggProgress()/GEMS_PER_EGG*100) + '%"></i></div>' +
        '<p class="tiny" style="margin:0 0 12px">' + (GEMS_PER_EGG - eggProgress()) + " more gems until the next egg hatches</p>") +
      '<button class="btn go wide big" data-act="done">Done</button>' +
      '<button class="btn ghost wide" data-act="again" style="margin-top:8px">Practise again</button>' +
    "</div>";
}

/* ==========================================================================
   SPEED SPRINT - fluency, not acquisition. Mastered-ish words only, so she is
   racing on words she already owns rather than guessing at new ones.
   ========================================================================== */
let SP = null;
function startSprint(){
  const pool = words().filter(function(w){ return w.box >= 2; });
  if(pool.length < 3){
    alert("Speed Sprint unlocks once a few words are solid. Do a normal practice first.");
    return;
  }
  SPEAK.unlock(); SFX.unlock();
  SP = {pool:shuffle(pool.slice()), i:0, right:0, wrong:0, end:Date.now() + 60000, over:false};
  document.body.classList.add("playing");
  RENDER.play = renderSprint;
  go("play");
  SP.timer = setInterval(function(){
    if(!SP) return;
    if(Date.now() >= SP.end){ SP.over = true; clearInterval(SP.timer); renderSprint(); }
    else { const t = el("sp-clock"); if(t) t.textContent = Math.max(0, Math.ceil((SP.end - Date.now())/1000)) + "s"; }
  }, 250);
}
function endSprint(){
  if(SP && SP.timer) clearInterval(SP.timer);
  SP = null;
  RENDER.play = playRenderer;
  document.body.classList.remove("playing");
  SPEAK.stop();
  go("home");
}
function renderSprint(){
  const v = el("v-play");
  if(!SP) return;
  if(SP.over){
    const gained = Math.floor(SP.right / 4);
    if(!SP.closed){ SP.closed = true; if(gained){ addGems(gained); save(); chrome(); } }
    v.innerHTML = '<div class="card center pop">' +
      "<h2 style='margin:2px 0 6px'>Time!</h2>" +
      "<p class='muted'>" + plural(SP.right, "word") + " spelled correctly in 60 seconds.</p>" +
      (gained ? "<p class='tiny'>+" + gained + " gems</p>" : "") +
      '<button class="btn go wide big" data-act="sprintdone" style="margin-top:10px">Done</button>' +
    "</div>";
    return;
  }
  const w = SP.pool[SP.i % SP.pool.length];
  v.innerHTML =
    '<div class="row" style="margin:6px 0 14px">' +
      '<button class="iconbtn" data-act="sprintdone" aria-label="Stop">✕</button>' +
      '<div class="grow center"><b id="sp-clock">60s</b></div>' +
      '<span class="tiny">✓ ' + SP.right + "</span>" +
    "</div>" +
    '<div class="card">' +
      '<p class="tiny center" style="margin:0 0 6px;text-transform:uppercase;letter-spacing:.08em;font-weight:800">Speed Sprint</p>' +
      '<div class="center" style="font-size:46px;margin:2px 0 8px">⚡️</div>' +
      '<div class="row" style="justify-content:center;margin-bottom:12px">' +
        '<button class="btn ghost sm" data-act="hear-sprint">🔊 Again</button>' +
      "</div>" +
      (SPEAK.available() && !SP.shown ?
        '<p class="center" style="margin:0 0 10px"><button class="tiny" data-act="revealsprint" style="text-decoration:underline">Can\'t hear it? Show the words</button></p>' :
        '<div class="word lg" style="margin-bottom:12px">' + esc(w.text) + "</div>") +
      '<input class="answer" id="ans" type="text" autocapitalize="off" autocomplete="off" ' +
        'autocorrect="off" spellcheck="false" enterkeyhint="go" placeholder="type it fast">' +
      '<button class="btn go wide" data-act="sprintgo" style="margin-top:10px">Enter</button>' +
    "</div>";
  const a = el("ans"); if(a) setTimeout(function(){ a.focus(); }, 50);
  SPEAK.say([w.text], {rate:0.95});
}
function sprintSubmit(){
  const a = el("ans"); if(!a || !SP) return;
  const w = SP.pool[SP.i % SP.pool.length];
  const ok = sameWord(a.value.trim(), w.text);
  if(ok){ SP.right++; SFX.tick(); gradeWord(w, true, "recall"); }
  else  { SP.wrong++; SFX.soft(); gradeWord(w, false, "recall"); }
  SP.i++;
  renderSprint();
}

/* ==========================================================================
   PATTERN SORT - word study. Grouping by rule is what makes a list transfer
   to words that were never on it.
   ========================================================================== */
let SO = null;
function startSort(){
  const buckets = {};
  words().forEach(function(w){
    const p = LEX.mainPattern(w.text);
    if(!p) return;
    (buckets[p.id] = buckets[p.id] || {pat:p, ws:[]}).ws.push(w);
  });
  const usable = Object.values(buckets).filter(function(b){ return b.ws.length >= 2; }).slice(0, 3);
  if(usable.length < 2){
    alert(usable.length === 1
      ? "Every word here follows the same rule, so there is nothing to sort them into. Add another list — or build one with \u201cA mix of everything\u201d — and this game opens up."
      : "Pattern Sort needs a few more words before it can group them. Add this week's list and try again.");
    return;
  }
  const cards = shuffle(usable.reduce(function(acc, b){
    return acc.concat(b.ws.slice(0, 4).map(function(w){ return {text:w.text, pid:b.pat.id}; }));
  }, []));
  SO = {cats:usable.map(function(b){ return b.pat; }), cards:cards, i:0, right:0, wrong:0};
  SFX.unlock();
  document.body.classList.add("playing");
  RENDER.play = renderSort;
  go("play");
}
function endSort(){
  SO = null; RENDER.play = playRenderer;
  document.body.classList.remove("playing");
  go("home");
}
function renderSort(){
  const v = el("v-play");
  if(!SO) return;
  if(SO.i >= SO.cards.length){
    const gained = SO.right >= SO.cards.length - 1 ? 1 : 0;
    if(!SO.closed){ SO.closed = true; if(gained){ addGems(gained); save(); chrome(); } }
    v.innerHTML = '<div class="card center pop">' +
      "<h2 style='margin:2px 0 6px'>Sorted!</h2>" +
      "<p class='muted'>" + SO.right + " of " + SO.cards.length + " in the right group.</p>" +
      (gained ? "<p class='tiny'>+1 gem</p>" : "") +
      '<button class="btn go wide big" data-act="sortdone" style="margin-top:10px">Done</button>' +
    "</div>";
    return;
  }
  const c = SO.cards[SO.i];
  v.innerHTML =
    '<div class="row" style="margin:6px 0 14px">' +
      '<button class="iconbtn" data-act="sortdone" aria-label="Stop">✕</button>' +
      '<div class="grow"><div class="bar"><i style="width:' + (SO.i / SO.cards.length * 100) + '%"></i></div></div>' +
      '<span class="tiny">' + (SO.i + 1) + "/" + SO.cards.length + "</span>" +
    "</div>" +
    '<div class="card center">' +
      '<p class="tiny" style="margin:0 0 8px;text-transform:uppercase;letter-spacing:.08em;font-weight:800">Which rule does this word follow?</p>' +
      '<div class="word xl" style="margin-bottom:6px">' + esc(c.text) + "</div>" +
      '<button class="btn ghost sm" data-act="hear-sort">🔊 Hear it</button>' +
    "</div>" +
    SO.cats.map(function(p){
      return '<button class="btn ghost wide" data-cat="' + p.id + '" style="margin-bottom:9px;flex-direction:column;align-items:flex-start;padding:12px 16px;min-height:auto">' +
               "<b>" + esc(p.label) + "</b>" +
               '<span class="tiny" style="font-weight:600;text-align:left">' + esc(p.tip) + "</span>" +
             "</button>";
    }).join("");
}
function sortPick(pid){
  const c = SO.cards[SO.i];
  if(pid === c.pid){ SO.right++; SFX.good(); }
  else{ SO.wrong++; SFX.soft(); }
  SO.i++;
  renderSort();
}
const playRenderer = RENDER.play;

/* ==========================================================================
   SPRITES
   ========================================================================== */
RENDER.sprites = function(){
  const v = el("v-sprites");
  let h = "<h2 style='margin:6px 0 4px'>My sprites</h2>" +
          '<p class="muted" style="margin:0 0 14px">' + DB.sprites + " of " + ART.count + " hatched. " +
          "Tap one to hear its spelling tip.</p>" +
          '<div class="card flat" style="padding:12px">' +
            '<div class="row spread" style="margin-bottom:8px"><h3 style="margin:0">Next egg</h3>' +
            '<span class="tiny">' + eggProgress() + " / " + GEMS_PER_EGG + "</span></div>" +
            '<div class="bar teal"><i style="width:' + (eggProgress()/GEMS_PER_EGG*100) + '%"></i></div>' +
          "</div>" +
          '<div class="gallery">';

  for(let i = 0; i < ART.count; i++){
    const got = i < DB.sprites;
    h += '<div class="sprite' + (got ? "" : " locked") + '"' + (got ? ' data-sprite="' + i + '"' : "") + ">" +
           ART.draw(i) +
           '<div class="nm">' + (got ? esc(ART.SPRITES[i].n) : "???") + "</div>" +
         "</div>";
  }
  h += "</div>" +
       '<div id="sprite-tip" class="note" style="margin-top:14px;display:none"></div>';
  v.innerHTML = h;
};

/* ==========================================================================
   GROWN-UPS
   ========================================================================== */
let grownTab = "progress";

RENDER.grown = function(){
  const v = el("v-grown");
  const tabs = [["progress","Progress"], ["words","Words"], ["settings","Settings"], ["how","Method"]];
  let h = "<h2 style='margin:6px 0 12px'>Grown-ups</h2>" +
          '<div class="seg">' + tabs.map(function(t){
            return '<button data-gt="' + t[0] + '" class="' + (grownTab === t[0] ? "on" : "") + '">' + t[1] + "</button>";
          }).join("") + "</div>";

  if(grownTab === "progress") h += progressPane();
  if(grownTab === "words")    h += wordsPane();
  if(grownTab === "settings") h += settingsPane();
  if(grownTab === "how")      h += methodPane();
  v.innerHTML = h;
};

function progressPane(){
  const ws = words();
  const mastered = ws.filter(isMastered).length;
  const last14 = DB.log.filter(function(r){ return daysBetween(r.d, today()) < 14; });
  const totalTried = last14.reduce(function(a, r){ return a + r.n; }, 0);
  const totalRight = last14.reduce(function(a, r){ return a + r.right; }, 0);
  const acc = totalTried ? Math.round(totalRight / totalTried * 100) : 0;
  const days = new Set(last14.map(function(r){ return r.d; })).size;

  const tricky = ws.filter(function(w){ return w.wrong >= 2; })
                   .sort(function(a, b){ return (b.wrong - b.right) - (a.wrong - a.right); })
                   .slice(0, 8);

  let h = '<div class="stats" style="margin-bottom:14px">' +
            '<div class="s"><b>' + mastered + "</b><span>mastered</span></div>" +
            '<div class="s"><b>' + acc + "%</b><span>last 14 days</span></div>" +
            '<div class="s"><b>' + days + "</b><span>days practised</span></div>" +
          "</div>";

  h += '<div class="card"><h3>Needs work</h3>';
  if(!tricky.length){
    h += '<p class="muted" style="margin:0">Nothing is causing trouble right now.</p>';
  }else{
    tricky.forEach(function(w){
      const common = w.misses.length ? w.misses.slice(-3).join(", ") : "";
      h += '<div class="wrow"><div class="grow"><div class="wt">' + esc(w.text) + "</div>" +
           (common ? '<div class="tiny">' + esc(common) + "</div>" : "") + "</div>" +
           '<span class="tiny">' + w.right + "✓ / " + w.wrong + "✗</span></div>";
    });
  }
  h += "</div>";

  h += '<div class="card"><h3>Print a practice test</h3>' +
       '<p class="tiny" style="margin-bottom:10px">Two pages: a numbered answer sheet for her, and a dictation sheet with the words and sentences for you. Writing by hand is still the form the school test takes.</p>' +
       '<select id="print-list" style="margin-bottom:10px">' +
         '<option value="">All words</option>' +
         DB.lists.map(function(l){ return '<option value="' + l.id + '">' + esc(l.title) + "</option>"; }).join("") +
       "</select>" +
       '<button class="btn ghost wide" data-act="print">Print</button></div>';

  h += '<div class="card"><h3>Backup</h3>' +
       '<p class="tiny" style="margin-bottom:10px">Everything lives in this browser only. Clearing site data wipes it — export now and then.</p>' +
       '<button class="btn ghost wide" data-act="export" style="margin-bottom:8px">Export a backup file</button>' +
       '<input type="file" id="f-restore" accept="application/json" style="display:none">' +
       '<button class="btn ghost wide" data-act="restore">Restore from backup</button></div>';
  return h;
}

function wordsPane(){
  const ws = words().slice().sort(function(a, b){ return a.box - b.box || a.text.localeCompare(b.text); });
  if(!ws.length) return '<div class="empty"><span class="ic">📋</span>No words yet.</div>';
  let h = '<div class="card flat" style="padding:10px 14px">';
  ws.forEach(function(w){
    const st = statusOf(w);
    const l = listById(w.listId);
    h += '<div class="wrow"><div class="grow">' +
           '<div class="wt">' + esc(w.text) + "</div>" +
           '<div class="tiny">' + (l ? esc(l.title) + " · " : "") +
             (w.seen ? "due " + esc(w.due) : "not started") + "</div>" +
         "</div>" +
         '<span class="badge ' + st.k + '">' + st.t + "</span>" +
         '<button class="iconbtn" data-del="' + w.id + '" aria-label="Delete">🗑</button>' +
       "</div>";
  });
  return h + "</div>";
}

function settingsPane(){
  const p = DB.profile;
  return '<div class="card">' +
    '<label class="fld"><span>Her name</span><input type="text" id="s-name" value="' + esc(p.name) + '" placeholder="e.g. Nora"></label>' +
    '<label class="fld"><span>Each session covers</span>' +
      '<select id="s-mode">' +
        '<option value="few"' + (p.wholeList ? "" : " selected") + '>A few words at a time</option>' +
        '<option value="whole"' + (p.wholeList ? " selected" : "") + '>The whole list, every time</option>' +
      "</select>" +
      '<span class="tiny" style="font-weight:600;margin-top:4px;display:block">' +
      (p.wholeList
        ? "All " + practicePool().length + " words on the list marked <i>practising</i> appear in every session, each at whatever level it has reached. This is the classic weekly routine \u2014 cover the list daily, test on Friday."
        : "The app picks what is due plus a few new words. Gentler, but a 12-word list takes several sessions to introduce.") +
      "</span></label>" +
    '<div id="few-only"' + (p.wholeList ? ' style="display:none"' : "") + ">" +
      '<label class="fld"><span>Words per practice session</span>' +
        '<input type="number" id="s-size" min="4" max="30" value="' + p.sessionSize + '"></label>' +
      '<label class="fld"><span>New words introduced per session</span>' +
        '<input type="number" id="s-new" min="1" max="20" value="' + p.newPerSession + '">' +
        '<span class="tiny" style="font-weight:600;margin-top:4px;display:block">Three is a gentle ceiling for a child who finds spelling hard. Raise it to cover a list faster.</span></label>' +
    "</div>" +
    '<label class="fld"><span>Reading speed</span>' +
      '<select id="s-rate">' +
        ["0.7|Slow","0.82|Normal","0.95|Quick"].map(function(o){
          const p2 = o.split("|");
          return '<option value="' + p2[0] + '"' + (String(DB.profile.rate) === p2[0] ? " selected" : "") + ">" + p2[1] + "</option>";
        }).join("") +
      "</select></label>" +
    '<div class="switch"><span>Sound effects</span><input type="checkbox" id="s-sound"' + (p.sound !== false ? " checked" : "") + "></div>" +
    '<div class="switch"><span>Show spelling-rule hints</span><input type="checkbox" id="s-hints"' + (p.hints !== false ? " checked" : "") + "></div>" +
    '<div class="switch"><span>Also review older lists<br><span class="tiny" style="font-weight:600">Off means practice uses only the list marked <i>practising</i> \u2014 this week\'s words and nothing else.</span></span>' +
      '<input type="checkbox" id="s-reviewold"' + (p.reviewOld ? " checked" : "") + "></div>" +
    '<div class="switch"><span>Bigger text</span><input type="checkbox" id="s-big"' + (p.big ? " checked" : "") + "></div>" +
    '<button class="btn wide" data-act="savesettings" style="margin-top:14px">Save settings</button>' +
  "</div>" +
  '<div class="card"><h3>Start over</h3>' +
    '<p class="tiny" style="margin-bottom:10px">Deletes every list, word and sprite on this device.</p>' +
    '<button class="btn warn wide" data-act="wipe">Erase everything</button></div>';
}

function methodPane(){
  return '<div class="card">' +
    "<h3>Why the app behaves the way it does</h3>" +
    '<p class="ref"><b>She corrects her own errors, letter by letter.</b> The corrected-test method — test, compare against the correct form, fix it immediately — outperformed study-only approaches in Horn\'s work on spelling instruction (1947) and in Schoephoerster\'s comparison of test-study plans (1962). That is why a wrong answer is never simply marked wrong and moved past: she is shown the difference and made to write it correctly before continuing.</p>' +
    '<p class="ref"><b>Look, cover, write, compare.</b> Cover-Copy-Compare has a long evidence base as a low-cost spelling intervention (Skinner, McLaughlin &amp; Logan, 1997, review). It is the middle scaffold level here.</p>' +
    '<p class="ref"><b>Retrieval, not rereading.</b> Recalling a word from memory produces far more durable learning than re-studying it (Roediger &amp; Karpicke, 2006). Only unsupported retrieval moves a word forward in the schedule — copying a word she can see does not count as evidence.</p>' +
    '<p class="ref"><b>Spacing beats cramming.</b> Reviews expand across days — 1, 2, 4, 7, 14 (Cepeda, Pashler, Vul, Wixted &amp; Rohrer, 2006). Past the early boxes a word can only be promoted on a <i>different day</i>, so mastery cannot be manufactured in one long sitting.</p>' +
    '<p class="ref"><b>Patterns, not fifteen separate shapes.</b> Every word is tagged with its orthographic pattern and Pattern Sort groups by rule, following the word-study tradition (Bear, Invernizzi, Templeton &amp; Johnston). A rule transfers to words that were never on the list.</p>' +
    '<p class="ref"><b>She is never shown a misspelling.</b> Simply reading an incorrect spelling measurably degrades later accuracy (Brown, 1988; Jacoby &amp; Hollingshead, 1990). So there is no "pick the correct spelling" game here, even though almost every spelling app has one. The only wrong spelling she ever sees is the one she just wrote, on the compare screen, which is the mechanism the corrected-test method depends on.</p>' +
    '<p class="ref"><b>Rewards follow real progress.</b> Gems are awarded when a word actually becomes durable, not for time spent or taps made, because rewards attached to mere activity can crowd out the interest they were meant to support (Deci &amp; Ryan; Lepper, Greene &amp; Nisbett, 1973).</p>' +
    '<p class="ref"><b>Hearing the word matters.</b> A spelling test is an auditory task, so dictation follows the classroom pattern: word, sentence, word again. The sentence also disambiguates homophones — there, their and they\'re are indistinguishable without it.</p>' +
  "</div>";
}

/* --- print ---------------------------------------------------------------- */
function doPrint(){
  const sel = el("print-list");
  const id = sel ? sel.value : "";
  const ws = words().filter(function(w){ return !id || w.listId === id; });
  if(!ws.length){ alert("No words to print."); return; }
  const title = id ? (listById(id) || {}).title : "All words";
  const name = DB.profile.name ? DB.profile.name + " — " : "";

  el("print").innerHTML =
    "<h1>" + esc(name + title) + "</h1>" +
    '<div class="sub">Spelling practice · ' + new Date().toLocaleDateString() + "</div>" +
    "<ol>" + ws.map(function(){ return "<li>&nbsp;</li>"; }).join("") + "</ol>" +
    '<div class="dict"><h1>Dictation sheet</h1>' +
    '<div class="sub">Read the word, then the sentence, then the word again.</div>' +
    "<ol>" + ws.map(function(w){
      return "<li><b>" + esc(w.text) + "</b>" + (w.sentence ? " — " + esc(w.sentence) : "") + "</li>";
    }).join("") + "</ol></div>";
  setTimeout(function(){ window.print(); }, 60);
}

/* --- export / restore ----------------------------------------------------- */
function doExport(){
  const blob = new Blob([JSON.stringify(DB, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "spelling-sprites-" + today() + ".json";
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function doRestore(file){
  const r = new FileReader();
  r.onload = function(){
    try{
      const d = JSON.parse(r.result);
      if(!d || !Array.isArray(d.words)) throw new Error("bad file");
      if(!confirm("Replace everything on this device with the backup?")) return;
      DB = Object.assign(blank(), d);
      DB.profile = Object.assign(blank().profile, d.profile || {});
      save(); chrome(); go("grown");
    }catch(e){ alert("That file could not be read as a Spelling Sprites backup."); }
  };
  r.readAsText(file);
}

/* --- one global click handler -------------------------------------------- */
document.addEventListener("click", function(e){
  const t = e.target.closest("[data-act],[data-go],[data-open],[data-mode],[data-drop],[data-del],[data-say],[data-gt],[data-cat],[data-sprite],[data-unheard]");
  if(!t) return;

  /* sprite tip */
  if(t.dataset.sprite != null){
    const s = ART.SPRITES[+t.dataset.sprite % ART.count];
    const box = el("sprite-tip");
    box.style.display = "block";
    box.innerHTML = "<b>" + esc(s.n) + " says:</b> " + esc(s.tip);
    SPEAK.say([s.tip], {rate:0.9});
    return;
  }
  if(t.dataset.open){ openList = t.dataset.open; go("lists"); return; }
  if(t.dataset.mode){ if(t.dataset.mode !== "speak") HEAR.stop(); draft.mode = t.dataset.mode; draft.msg = ""; renderAdd(); return; }
  if(t.dataset.gt){ grownTab = t.dataset.gt; RENDER.grown(); return; }
  if(t.dataset.cat){ sortPick(t.dataset.cat); return; }
  if(t.dataset.unheard != null){ draft.heard.splice(+t.dataset.unheard, 1); renderAdd(); return; }
  if(t.dataset.drop != null){ collectReview(); draft.words.splice(+t.dataset.drop, 1); renderAdd(); return; }
  if(t.dataset.say){
    const w = wordById(t.dataset.say);
    if(w){ SPEAK.unlock(); SPEAK.dictate(w.text, w.sentence, {rate:DB.profile.rate}); }
    return;
  }
  if(t.dataset.del){
    const w = wordById(t.dataset.del);
    if(w && confirm('Delete "' + w.text + '"?')){
      DB.words = DB.words.filter(function(x){ return x.id !== w.id; });
      save(); RENDER.grown();
    }
    return;
  }

  const a = t.dataset.act;
  const cur = S && S.items[S.i] ? wordById(S.items[S.i].wid) : null;

  switch(a){
    case "addlist":  startAdd(null); break;
    case "addto":    startAdd(openList); break;
    case "setactive": DB.activeListId = openList; save(); RENDER.lists(); break;
    case "switch": {
      const names = DB.lists.map(function(l, i){ return (i+1) + ". " + l.title; }).join("\n");
      const pick = prompt("Which list should she practise?\n\n" + names, "1");
      const i = parseInt(pick, 10) - 1;
      if(DB.lists[i]){ DB.activeListId = DB.lists[i].id; save(); RENDER.home(); }
      break;
    }
    case "canceladd":HEAR.stop(); draft = null; RENDER.lists(); break;
    case "backadd":  draft.words = []; renderAdd(); break;
    case "backlist": openList = null; RENDER.lists(); break;
    case "addrow":   collectReview(); draft.words.push({text:"", sentence:""}); renderAdd(); break;
    case "saveList": saveDraft(); break;
    case "dellist": {
      const l = listById(openList);
      if(l && confirm('Delete "' + l.title + '" and its words?')){
        DB.words = DB.words.filter(function(w){ return w.listId !== l.id; });
        DB.lists = DB.lists.filter(function(x){ return x.id !== l.id; });
        save(); openList = null; RENDER.lists();
      }
      break;
    }
    case "parse": {
      const txt = el("f-text") ? el("f-text").value : "";
      const found = LEX.parse(txt);
      if(!found.length){ alert("No words found in that text yet."); break; }
      if(el("f-title")) draft.title = el("f-title").value.trim() || draft.title;
      draft.words = found.map(function(x){ return {text:x, sentence:LEX.sentenceFor(x)}; });
      renderAdd();
      break;
    }
    case "pickphoto": el("f-file").click(); break;
    case "mic": {
      if(HEAR.isOn()){ HEAR.stop(); draft.msg = ""; renderAdd(); break; }
      draft.msg = "";
      HEAR.start(function(text){
        LEX.parse(text).forEach(function(w){
          if(draft.heard.indexOf(w) < 0) draft.heard.push(w);
        });
        SFX.tick();
        renderAdd();
      }, function(state, detail){
        if(state === "denied")      draft.msg = "The microphone is blocked for this page. Allow it in the browser's site settings, or use the Type tab with the keyboard's microphone key.";
        else if(state === "error")  draft.msg = "Listening stopped (" + (detail || "error") + "). Tap to start again.";
        else if(state === "unsupported") draft.msg = "This browser cannot listen. Use the Type tab with the keyboard microphone instead.";
        renderAdd();
      });
      renderAdd();
      break;
    }
    case "useheard": {
      if(el("f-title")) draft.title = el("f-title").value.trim() || draft.title;
      if(el("f-test"))  draft.testDate = el("f-test").value;
      HEAR.stop();
      draft.words = draft.heard.map(function(w){ return {text:w, sentence:LEX.sentenceFor(w)}; });
      renderAdd();
      break;
    }
    case "build": {
      if(el("f-title")) draft.title = el("f-title").value.trim() || draft.title;
      if(el("f-test"))  draft.testDate = el("f-test").value;
      draft.gen = {
        count: +el("g-count").value || 12,
        grade: el("g-grade").value,
        focus: el("g-focus").value
      };
      const picked = LEX.generate({
        count: draft.gen.count,
        grades: draft.gen.grade ? [+draft.gen.grade] : null,
        focus: draft.gen.focus,
        exclude: words().map(function(w){ return w.text; })
      });
      if(!picked.length){ alert("No new words match those boundaries — try a wider level or a different rule."); break; }
      const opt = LEX.focusOptions().find(function(o){ return o.id === draft.gen.focus; });
      if(opt && opt.id && draft.title.indexOf("Week of") === 0) draft.title = opt.label;
      draft.words = picked.map(function(e){ return {text:e.w, sentence:e.s}; });
      renderAdd();
      break;
    }

    case "play":     startSession(); break;
    case "sprint":   startSprint(); break;
    case "sort":     startSort(); break;
    case "quit":     if(confirm("Stop practice? Progress so far is saved.")) endSession(); break;
    case "submit":   submitAnswer(); break;
    case "submitfix":submitFix(); break;
    case "fix":      S.phase = "correct"; RENDER.play(); break;
    case "next":     nextItem(); break;
    case "done":     endSession(); break;
    case "again":    startSession(); break;
    case "hear":     if(cur) SPEAK.dictate(cur.text, cur.sentence, {rate:DB.profile.rate}); break;
    case "reveal":   if(S){ S.items[S.i].shown = true; RENDER.play(); } break;
    case "spell":    if(cur) SPEAK.spellOut(cur.text); break;

    case "hear-sprint": if(SP) SPEAK.say([SP.pool[SP.i % SP.pool.length].text], {rate:0.95}); break;
    case "revealsprint": if(SP){ SP.shown = true; renderSprint(); } break;
    case "sprintgo":    sprintSubmit(); break;
    case "sprintdone":  endSprint(); break;
    case "hear-sort":   if(SO) SPEAK.say([SO.cards[SO.i].text], {rate:DB.profile.rate}); break;
    case "sortdone":    endSort(); break;

    case "print":   doPrint(); break;
    case "export":  doExport(); break;
    case "restore": el("f-restore").click(); break;
    case "savesettings": {
      const p = DB.profile;
      p.name = el("s-name").value.trim();
      p.wholeList = el("s-mode").value === "whole";
      p.sessionSize = Math.max(4, Math.min(30, +el("s-size").value || 8));
      p.newPerSession = Math.max(1, Math.min(20, +el("s-new").value || 3));
      p.rate = parseFloat(el("s-rate").value) || 0.82;
      p.sound = el("s-sound").checked;
      p.hints = el("s-hints").checked;
      p.reviewOld = el("s-reviewold").checked;
      p.big = el("s-big").checked;
      save(); chrome(); RENDER.grown();
      break;
    }
    case "wipe":
      if(confirm("Erase every list, word and sprite on this device? This cannot be undone.")){
        if(confirm("Really erase everything?")){ DB = blank(); save(); chrome(); go("home"); }
      }
      break;
  }
});

/* Enter key submits wherever there is an answer box. */
document.addEventListener("keydown", function(e){
  if(e.key !== "Enter") return;
  const a = el("ans");
  if(!a || document.activeElement !== a) return;
  e.preventDefault();
  if(SP) return sprintSubmit();
  if(S && S.phase === "correct") return submitFix();
  if(S) return submitAnswer();
});

document.addEventListener("change", function(e){
  if(e.target.id === "f-restore" && e.target.files[0]) doRestore(e.target.files[0]);
  if(e.target.id === "s-mode"){
    const box = el("few-only");
    if(box) box.style.display = e.target.value === "whole" ? "none" : "";
  }
});

/* --- boot ----------------------------------------------------------------- */
load();
chrome();
go("home");

/* Prime the speech engine on the very first touch. iOS refuses to speak until
   a real user gesture has happened. */
document.addEventListener("touchstart", function once(){
  SPEAK.unlock(); SFX.unlock();
  document.removeEventListener("touchstart", once);
}, {passive:true, once:true});
